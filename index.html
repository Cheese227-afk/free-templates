<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starter Pages – customize and download website templates</title>
<meta name="description" content="Pick a template, add your logo and photos, customize the colors and download a ready-to-upload HTML page.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eef5;--panel:#fff;--ink:#12203a;--muted:#5a6780;--line:#cdd6e4;--signal:#ffb400;--r:10px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 "DM Sans",system-ui,sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;margin:0;line-height:1.05}
header{padding:3rem 5vw 1rem;max-width:1200px;margin:0 auto}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:800;max-width:14ch;letter-spacing:-.02em}
header p{max-width:56ch;color:var(--muted);margin:1rem 0 0;font-size:1.1rem}
.ad{display:flex;justify-content:center;max-width:100%;overflow:hidden}
.ad-top{margin:1rem auto}
main{display:grid;grid-template-columns:260px 1fr;gap:1.5rem;max-width:1200px;margin:0 auto;padding:1rem 5vw 4rem}
.side{display:flex;flex-direction:column;gap:1.5rem;align-items:flex-start}
.list{display:flex;flex-direction:column;gap:.6rem;width:100%}
.list button{all:unset;cursor:pointer;background:var(--panel);border:2px solid transparent;border-radius:var(--r);padding:.9rem 1rem}
.list button:hover{border-color:var(--line)}
button:focus-visible,.ctl input:focus-visible,.ctl select:focus-visible,.up:focus-within{outline:3px solid var(--ink);outline-offset:2px}
.list button[aria-pressed="true"]{border-color:var(--ink);box-shadow:5px 5px 0 var(--signal)}
.list b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.15rem}
.list span{color:var(--muted);font-size:.9rem}
.stage{background:var(--panel);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:1rem;align-items:end;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.ctl{display:flex;flex-direction:column;gap:.25rem;font-size:.85rem;color:var(--muted);font-weight:500}
.ctl input[type=text],.ctl select{font:inherit;color:var(--ink);padding:.5rem .6rem;border:1px solid var(--line);border-radius:6px;background:#fff;min-width:140px}
.ctl input[type=color]{width:56px;height:38px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff}
.up{position:relative;display:inline-block;padding:.5rem .9rem;border:1.5px dashed var(--muted);border-radius:6px;color:var(--ink);font-weight:700;cursor:pointer;background:#f6f8fb}
.up:hover{border-color:var(--ink);background:#fff}
.up input{position:absolute;inset:0;width:100%;opacity:0;cursor:pointer}
.ctl small{font-weight:400;min-height:1.3em}
.x{all:unset;cursor:pointer;color:#b3261e;text-decoration:underline}
.dl{margin-left:auto;font:700 1rem "DM Sans",sans-serif;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:.75rem 1.4rem;cursor:pointer}
.dl:hover{background:#243a64}
.frame{background:#dfe5ef;padding:1rem}
iframe{display:block;width:100%;height:600px;border:1px solid var(--line);border-radius:6px;background:#fff}
.note{padding:.9rem 1.2rem;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}
@media(max-width:820px){main{grid-template-columns:1fr}.list{flex-direction:row;overflow-x:auto}.list button{min-width:200px}.dl{margin-left:0;width:100%}}
</style>
<script data-cfasync="false" src="https://abscloud.org/1/3749ff503a42487a2ba1ac4c711f97bb"></script>
</head>
<body>
<header>
  <h1>Pick a page. Make it yours. Download it.</h1>
  <p>Choose a template, add your logo and photos, set your colors, and check the live preview. You get one HTML file with everything built in, ready to upload to your site.</p>
</header>

<div class="ad ad-top">
<script>
if(innerWidth>=520){atOptions={'key':'d1697cc3b77bb3b5c2d82f9b7a27f66e','format':'iframe','height':60,'width':468,'params':{}};document.write('<scr'+'ipt src="https://bauval.org/22/d1697cc3b77bb3b5c2d82f9b7a27f66e"><\/scr'+'ipt>')}
else{atOptions={'key':'6244950725f34fb61e3895186d8893e1','format':'iframe','height':50,'width':320,'params':{}};document.write('<scr'+'ipt src="https://bauval.org/22/6244950725f34fb61e3895186d8893e1"><\/scr'+'ipt>')}
</script>
</div>

<main>
  <aside class="side">
    <div class="list" id="list" role="group" aria-label="Templates"></div>
    <div class="ad">
<script>
if(innerWidth>=821){atOptions={'key':'5f25f66cb987d8defc9c4a6e7a801249','format':'iframe','height':300,'width':160,'params':{}};document.write('<scr'+'ipt src="https://bauval.org/22/5f25f66cb987d8defc9c4a6e7a801249"><\/scr'+'ipt>')}
</script>
    </div>
  </aside>

  <section class="stage" aria-label="Customize and preview">
    <div class="bar">
      <label class="ctl">Site name<input type="text" id="name" value="Juniper Studio" maxlength="40"></label>
      <label class="ctl">Tagline<input type="text" id="tag" value="Thoughtful websites for small businesses" maxlength="80"></label>
      <label class="ctl">Contact email<input type="text" id="email" value="hello@example.com" maxlength="60"></label>
      <label class="ctl">Accent color<input type="color" id="accent" value="#e5484d"></label>
      <label class="ctl">Font style<select id="font"><option>Sans</option><option>Serif</option><option>Mono</option></select></label>
      <label class="ctl">Theme<select id="theme"><option>Light</option><option>Dark</option></select></label>
    </div>
    <div class="bar" id="media">
      <div class="ctl">Logo<label class="up">Upload logo<input type="file" id="logo" accept="image/*"></label><small id="logoS"></small></div>
      <div class="ctl">Hero image<label class="up">Upload image<input type="file" id="hero" accept="image/*"></label><small id="heroS"></small></div>
      <div class="ctl">Gallery (pick up to 4)<label class="up">Upload images<input type="file" id="gal" accept="image/*" multiple></label><small id="galS"></small></div>
      <button class="dl" id="dl" type="button">Download HTML</button>
    </div>
    <div class="frame"><iframe id="view" title="Template preview"></iframe></div>
    <div class="note" id="note"></div>
  </section>
</main>

<script>
(function(){
  var FONTS={Sans:"'Helvetica Neue',Arial,sans-serif",Serif:"Georgia,'Times New Roman',serif",Mono:"ui-monospace,Menlo,Consolas,monospace"};
  var TH={Light:{bg:"#ffffff",fg:"#1b1f2a",line:"#0002",card:"#ffffff"},Dark:{bg:"#12151c",fg:"#eef1f6",line:"#fff3",card:"#1b2029"}};
  var IMG={logo:"",hero:"",gal:[]};
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function ink(hex){var n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?"#111":"#fff"}

  function page(s,css,body){
    var A=s.accent,T=ink(A),h=TH[s.theme];
    return '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>'+esc(s.name)+'</title>\n<meta name="description" content="'+esc(s.tag)+'">\n'+
    (s.img.logo?'<link rel="icon" href="'+s.img.logo+'">\n':'')+'<style>\n'+
    '*{box-sizing:border-box}body{margin:0;font-family:'+FONTS[s.font]+';background:'+h.bg+';color:'+h.fg+';line-height:1.6}img{max-width:100%;display:block}a{color:inherit}'+
    'nav{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1rem 5vw;flex-wrap:wrap}nav div a{margin-left:1.2rem;text-decoration:none}'+
    '.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.2rem;text-decoration:none;margin:0}.logo{height:38px;width:auto;max-width:160px;object-fit:contain}'+
    'section{padding:3.5rem 5vw}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.1;margin:0 0 1rem}h2{margin:0 0 1rem}'+
    '.btn{display:inline-block;background:'+A+';color:'+T+';padding:.75em 1.4em;border-radius:6px;text-decoration:none;font-weight:700}.btn:hover{filter:brightness(.92)}'+
    '.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1.4rem}'+
    '.card{background:'+h.card+';border:1px solid '+h.line+';border-radius:10px;padding:1.4rem;transition:transform .2s}.card:hover{transform:translateY(-3px)}.tint{background:'+A+'22}'+
    '.split{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center}.hero-img,.shot{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}'+
    '@media(max-width:760px){.split{grid-template-columns:1fr}}'+
    'footer{padding:2rem 5vw;border-top:1px solid '+h.line+';font-size:.9rem;opacity:.75}'+css+
    ':root{--a:'+A+'}\n</style>\n</head>\n<body>\n'+body+'\n</body>\n</html>\n';
  }
  function nav(s,links){
    return '<nav><a class="brand" href="#">'+(s.img.logo?'<img class="logo" src="'+s.img.logo+'" alt="">':'')+'<span>'+esc(s.name)+'</span></a><div>'+links.map(function(l){return '<a href="#'+l.toLowerCase()+'">'+l+'</a>'}).join('')+'</div></nav>\n'}
  function foot(s){return '<footer>© '+new Date().getFullYear()+' '+esc(s.name)+' · <a href="mailto:'+esc(s.email)+'">'+esc(s.email)+'</a></footer>'}
  function hero(s,text){return s.img.hero?'<div class="split"><div>'+text+'</div><img class="hero-img" src="'+s.img.hero+'" alt="'+esc(s.name)+'"></div>':text}
  function gal(s,title,id){return s.img.gal.length?'<section id="'+id+'"><h2>'+title+'</h2><div class="grid">'+s.img.gal.map(function(u,i){return '<img class="shot" src="'+u+'" alt="'+esc(s.name)+' photo '+(i+1)+'">'}).join('')+'</div></section>\n':''}
  function mail(s,label){return '<a class="btn" href="mailto:'+esc(s.email)+'">'+label+'</a>'}

  var T=[
    {id:"landing",title:"Business landing page",desc:"Hero, features, gallery, contact",
     note:"Logo and photos are embedded in the file. Replace them later with your own image URLs if you prefer.",
     build:function(s){return page(s,'.hero{padding:4.5rem 5vw}.hero p{max-width:50ch;font-size:1.2rem}.cta{text-align:center}',
      nav(s,["Features"].concat(s.img.gal.length?["Gallery"]:[],["Contact"]))+
      '<section class="hero tint">'+hero(s,'<h1>'+esc(s.tag)+'</h1><p>Tell visitors in one sentence what you do and who it is for.</p><a class="btn" href="#contact">Get in touch</a>')+'</section>\n'+
      '<section id="features"><h2>What you get</h2><div class="grid"><div class="card"><h3>Fast to start</h3><p>Describe the first benefit here.</p></div><div class="card"><h3>Easy to trust</h3><p>Describe the second benefit here.</p></div><div class="card"><h3>Built to last</h3><p>Describe the third benefit here.</p></div></div></section>\n'+
      gal(s,"Gallery","gallery")+
      '<section id="contact" class="cta"><h2>Ready when you are</h2><p>Email us or book a call.</p>'+mail(s,'Email '+esc(s.name))+'</section>\n'+foot(s))}},
    {id:"portfolio",title:"Portfolio",desc:"Intro, project grid, contact",
     note:"Your gallery images become the project grid. With no images you get placeholder blocks.",
     build:function(s){var w=s.img.gal.length?s.img.gal.map(function(u,i){return '<img class="shot" src="'+u+'" alt="Project '+(i+1)+'">'}):[1,2,3,4].map(function(n){return '<div class="work">Project '+n+'</div>'});
      return page(s,'.work{aspect-ratio:4/3;border-radius:12px;background:'+s.accent+'33;display:flex;align-items:end;padding:1rem;font-weight:700}.work:nth-child(even){background:'+s.accent+'66}',
      nav(s,["Work","Contact"])+'<section>'+hero(s,'<h1>'+esc(s.name)+'</h1><p style="font-size:1.2rem;max-width:48ch">'+esc(s.tag)+'</p>')+'</section>\n'+
      '<section id="work"><h2>Selected work</h2><div class="grid">'+w.join('')+'</div></section>\n'+
      '<section id="contact"><h2>Work with me</h2><p>I take on a few projects each quarter.</p>'+mail(s,'Say hello')+'</section>\n'+foot(s))}},
    {id:"blog",title:"Blog",desc:"Header and recent posts with thumbnails",
     note:"Gallery images appear as post thumbnails. Duplicate an <article> for each new post.",
     build:function(s){return page(s,'article{padding:1.5rem 0;border-bottom:1px solid '+TH[s.theme].line+';max-width:680px}article h2 a{text-decoration:none}article time{font-size:.85rem;opacity:.6}.head{background:'+s.accent+';color:'+ink(s.accent)+'}',
      nav(s,["Posts"])+'<section class="head">'+hero(s,'<h1>'+esc(s.name)+'</h1><p style="margin:0;max-width:50ch">'+esc(s.tag)+'</p>')+'</section>\n<section id="posts"><h2>Latest posts</h2>\n'+
      ["First post title","Second post title","Third post title"].map(function(t,i){return '<article>'+(s.img.gal[i]?'<img class="shot" src="'+s.img.gal[i]+'" alt="" style="margin-bottom:1rem">':'')+'<time>Jan '+(i+3)+', '+new Date().getFullYear()+'</time><h2><a href="#">'+t+'</a></h2><p>A short summary of the post goes here so readers know what to expect.</p></article>'}).join('\n')+
      '\n</section>\n'+foot(s))}},
    {id:"menu",title:"Restaurant menu",desc:"Hero, menu, photos, opening hours",
     note:"Edit the prices and dishes directly in the <ul class=\"menu\"> list.",
     build:function(s){return page(s,'.menu{list-style:none;padding:0;max-width:620px}.menu li{display:flex;justify-content:space-between;gap:1rem;padding:.8rem 0;border-bottom:1px dashed '+TH[s.theme].line+'}.menu em{display:block;font-size:.9rem;opacity:.65;font-style:normal}.hero{padding:4.5rem 5vw;background:'+s.accent+';color:'+ink(s.accent)+'}',
      nav(s,["Menu"].concat(s.img.gal.length?["Photos"]:[],["Hours"]))+'<section class="hero">'+hero(s,'<h1>'+esc(s.name)+'</h1><p style="max-width:44ch;font-size:1.2rem;margin:0">'+esc(s.tag)+'</p>')+'</section>\n<section id="menu"><h2>Menu</h2><ul class="menu">'+
      [["House soup","Seasonal vegetables","7"],["Grilled chicken","Herb butter, greens","16"],["Mushroom pasta","Cream, parmesan","14"],["Chocolate tart","Salted caramel","8"]].map(function(m){return '<li><span><b>'+m[0]+'</b><em>'+m[1]+'</em></span><b>$'+m[2]+'</b></li>'}).join('')+
      '</ul></section>\n'+gal(s,"Photos","photos")+'<section id="hours"><h2>Opening hours</h2><p>Tuesday to Sunday, 11:00 to 22:00<br>Closed Mondays</p></section>\n'+foot(s))}}
  ];

  var cur=T[0],$=function(i){return document.getElementById(i)};
  function state(){return {name:$("name").value||"Your site",tag:$("tag").value,email:$("email").value||"hello@example.com",accent:$("accent").value,font:$("font").value,theme:$("theme").value,img:IMG}}
  function render(){$("view").srcdoc=cur.build(state());$("note").textContent="Tip: "+cur.note}
  function pick(t){cur=t;[].forEach.call($("list").children,function(b){b.setAttribute("aria-pressed",b.dataset.id===t.id)});render()}
  function ui(){
    function st(id,k,txt){$(id).innerHTML=txt?txt+' · <button type="button" class="x" data-x="'+k+'">Remove</button>':'Optional'}
    st("logoS","logo",IMG.logo&&"Added");st("heroS","hero",IMG.hero&&"Added");st("galS","gal",IMG.gal.length&&IMG.gal.length+" added");render();
  }
  // Resize in the browser so the downloaded file stays small; SVG passes through untouched
  function load(file,max,mime){return new Promise(function(res){
    if(file.type==="image/svg+xml"){var r=new FileReader();r.onload=function(){res(r.result)};r.readAsDataURL(file);return}
    var u=URL.createObjectURL(file),i=new Image();
    i.onload=function(){var k=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
      var x=c.getContext("2d");if(mime==="image/jpeg"){x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height)}
      x.drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL(mime,.82))};
    i.onerror=function(){URL.revokeObjectURL(u);res("")};i.src=u})}

  T.forEach(function(t){
    var b=document.createElement("button");b.type="button";b.dataset.id=t.id;b.setAttribute("aria-pressed",t===cur);
    b.innerHTML="<b>"+t.title+"</b><span>"+t.desc+"</span>";b.onclick=function(){pick(t)};$("list").appendChild(b);
  });
  ["name","tag","email","accent","font","theme"].forEach(function(i){$(i).addEventListener("input",render)});
  $("logo").onchange=function(){var f=this.files[0];this.value="";if(f)load(f,400,"image/png").then(function(u){IMG.logo=u;ui()})};
  $("hero").onchange=function(){var f=this.files[0];this.value="";if(f)load(f,1600,"image/jpeg").then(function(u){IMG.hero=u;ui()})};
  $("gal").onchange=function(){var fs=[].slice.call(this.files,0,4);this.value="";if(fs.length)Promise.all(fs.map(function(f){return load(f,1000,"image/jpeg")})).then(function(us){IMG.gal=us.filter(Boolean);ui()})};
  $("media").addEventListener("click",function(e){var k=e.target.dataset&&e.target.dataset.x;if(k){IMG[k]=k==="gal"?[]:"";ui()}});
  $("dl").onclick=function(){
    var s=state(),slug=s.name.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"site";
    var url=URL.createObjectURL(new Blob([cur.build(s)],{type:"text/html"}));
    var a=document.createElement("a");a.href=url;a.download=slug+"-"+cur.id+".html";document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);
  };
  ui();
})();
</script>
